# Standard Option-Critic Configuration
algorithm: "standard_oc"

# Architecture
network:
  num_options: 4
  num_actions: 80
  d_model: 256
  n_layers: 4
  temporal_backbone: "gru"
  seq_len: 24
  is_cf_oc: false

# Training Hyperparameters
training:
  episodes: 250
  batch_size: 64
  lr: 0.0001
  gamma: 0.99
  deliberation_cost: 0.05
  entropy_coef: 0.01
  termination_reg_coef: 0.01
  buffer_capacity: 40000
  update_freq: 2

# Evaluation Protocol
eval:
  start_case: 90800
  num_cases: 500
  time_limit: 50.0
  time_step: 0.25
